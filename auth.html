<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Verdant Root</title>

<style>
body{
margin:0;
font-family:Arial;
background: radial-gradient(circle at top,#0a0f0d,#020303);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.auth-box{
width:340px;
padding:35px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(20px);
border-radius:15px;
box-shadow:0 0 30px rgba(212,175,55,0.3);
text-align:center;
}

h2{
margin-bottom:20px;
color:#d4af37;
}

input{
width:100%;
padding:12px;
margin-top:12px;
background:#111;
border:1px solid rgba(255,255,255,0.1);
color:white;
border-radius:8px;
}

button{
width:100%;
margin-top:15px;
padding:12px;
background:#d4af37;
border:none;
cursor:pointer;
font-weight:bold;
border-radius:8px;
}

.google-btn{
background:#fff;
color:#000;
}

.divider{
margin:15px 0;
opacity:0.5;
font-size:13px;
}
</style>
</head>

<body>

<div class="auth-box">

<h2>Secure Login</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>

<div class="divider">OR</div>

<button class="google-btn" onclick="googleLogin()">Continue with Google</button>

</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>

// 🔥 CONFIG
var firebaseConfig = {
  apiKey: "AIzaSyCVwTDc6UY7mZS0ueRnvR2gh_h-UdtS-n0",
  authDomain: "verdantroot-fd3e6.firebaseapp.com",
  projectId: "verdantroot-fd3e6",
  storageBucket: "verdantroot-fd3e6.firebasestorage.app",
  messagingSenderId: "239731093925",
  appId: "1:239731093925:web:69cedcbbf680b37ba9384c"
};

firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();

// ==========================
// ✅ SIGNUP
// ==========================
function signup(){

let name = document.getElementById("name").value;
let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

if(!name || !email || !pass){
alert("Fill all fields ❌");
return;
}

firebase.auth().createUserWithEmailAndPassword(email, pass)
.then(function(result){

// update profile
result.user.updateProfile({
displayName: name
});

// 🔥 SAVE IN DATABASE
let userData = {
uid: result.user.uid,
name: name,
email: email,
plan: "free",
createdAt: new Date()
};

db.collection("users").doc(result.user.uid).set(userData);

// local storage
localStorage.setItem("user", JSON.stringify(userData));

alert("Account Created ✅");
window.location.href="index.html";

})
.catch(function(error){
alert(error.message);
});

}

// ==========================
// ✅ LOGIN
// ==========================
function login(){

let email = document.getElementById("email").value;
let pass = document.getElementById("password").value;

firebase.auth().signInWithEmailAndPassword(email, pass)
.then(function(result){

// 🔥 FETCH FROM DATABASE
db.collection("users").doc(result.user.uid).get()
.then(function(doc){

let user = doc.data();

localStorage.setItem("user", JSON.stringify(user));

alert("Login Successful 🚀");
window.location.href="index.html";

});

})
.catch(function(error){
alert(error.message);
});

}

// ==========================
// 🔥 GOOGLE LOGIN
// ==========================
function googleLogin(){

var provider = new firebase.auth.GoogleAuthProvider();

firebase.auth().signInWithPopup(provider)
.then(function(result){

let userRef = db.collection("users").doc(result.user.uid);

// check user exist
userRef.get().then(function(doc){

if(doc.exists){
localStorage.setItem("user", JSON.stringify(doc.data()));
}else{

let newUser = {
uid: result.user.uid,
name: result.user.displayName,
email: result.user.email,
plan: "free",
createdAt: new Date()
};

userRef.set(newUser);
localStorage.setItem("user", JSON.stringify(newUser));

}

alert("Google Login Successful 🚀");
window.location.href="index.html";

});

})
.catch(function(error){
alert(error.message);
});

}

</script>

</body>
</html>
