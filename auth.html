<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Verdant Root</title>

<style>
body{
margin:0;
font-family:Arial;
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:320px;
padding:30px;
background:#111;
border-radius:12px;
box-shadow:0 0 20px rgba(212,175,55,0.3);
}

input{
width:100%;
padding:10px;
margin-top:10px;
background:#222;
border:none;
color:white;
}

button{
width:100%;
margin-top:15px;
padding:10px;
background:#d4af37;
border:none;
cursor:pointer;
}
</style>
</head>

<body>
<div class="auth-box">

<h2>Secure Login</h2>
<input type="text" id="name" placeholder="Full Name">
<input type="text" id="phone" placeholder="+91XXXXXXXXXX">

<div id="recaptcha-container"></div>

<button onclick="sendOTP()">Send OTP</button>

<input type="text" id="otp" placeholder="Enter OTP">

<button onclick="verifyOTP()">Verify & Login</button>

</div>

</script>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

<script>

// 🔥 YOUR REAL CONFIG
var firebaseConfig = {
  apiKey: "AIzaSyCVwTDc6UY7mZS0ueRnvR2gh_h-UdtS-n0",
  authDomain: "verdantroot-fd3e6.firebaseapp.com",
  projectId: "verdantroot-fd3e6",
  storageBucket: "verdantroot-fd3e6.firebasestorage.app",
  messagingSenderId: "239731093925",
  appId: "1:239731093925:web:69cedcbbf680b37ba9384c"
};

firebase.initializeApp(firebaseConfig);

// 🔐 RECAPTCHA INIT
window.onload = function(){
    window.recaptchaVerifier = new firebase.auth.RecaptchaVerifier('recaptcha-container', {
        'size': 'normal'
    });
};

// GLOBAL
let confirmationResult;

// 📩 SEND OTP
function sendOTP(){
    let phone = document.getElementById("phone").value;

    firebase.auth().signInWithPhoneNumber(phone, recaptchaVerifier)
    .then(function(result){
        confirmationResult = result;
        alert("OTP Sent ✅");
    })
    .catch(function(error){
        alert(error.message);
    });
}

// ✅ VERIFY OTP
function verifyOTP(){
    let code = document.getElementById("otp").value;

    confirmationResult.confirm(code)
    .then(function(result){

        let user = {
            phone: result.user.phoneNumber
        };

        localStorage.setItem("user", JSON.stringify(user));

        alert("Login Successful 🚀");

        window.location.href = "index.html";

    })
    .catch(function(error){
        alert("Invalid OTP ❌");
    });
}

</script>

</body>
</html>
