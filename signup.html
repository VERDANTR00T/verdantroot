<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verdant Root | Sign Up</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter',sans-serif;
background: radial-gradient(circle at top,#0a0f0d,#020303);
color:white;
}

.container{
max-width:400px;
margin:80px auto;
padding:40px;
background:rgba(255,255,255,0.05);
border-radius:15px;
backdrop-filter:blur(20px);
}

h2{
text-align:center;
font-family:'Playfair Display';
color:#d4af37;
}

input{
width:100%;
padding:12px;
margin-top:10px;
background:#111;
border:none;
color:white;
border-radius:8px;
}

button{
width:100%;
margin-top:20px;
padding:12px;
background:#d4af37;
border:none;
color:black;
font-weight:600;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<input type="text" id="address" placeholder="Address">

<button onclick="signup()">Sign Up</button>

</div>

<script>

function signup(){

let user = {
name: document.getElementById("name").value,
email: document.getElementById("email").value,
password: document.getElementById("password").value,
address: document.getElementById("address").value
};

localStorage.setItem("user", JSON.stringify(user));

alert("Account Created Successfully!");

window.location.href = "login.html";

}

</script>

</body>
</html>
