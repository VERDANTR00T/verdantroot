<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verdant Root | Login</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Inter';
background: radial-gradient(circle at top,#0a0f0d,#020303);
color:white;
}

.container{
max-width:400px;
margin:100px auto;
padding:40px;
background:rgba(255,255,255,0.05);
border-radius:15px;
backdrop-filter:blur(20px);
}

h2{
text-align:center;
color:#d4af37;
font-family:'Playfair Display';
}

input{
width:100%;
padding:12px;
margin-top:15px;
background:#111;
border:none;
color:white;
border-radius:8px;
}

button{
width:100%;
margin-top:20px;
padding:12px;
background:#d4af37;
border:none;
color:black;
font-weight:600;
border-radius:10px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

<h2>Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

</div>

<script>

function login(){

let user = JSON.parse(localStorage.getItem("user"));

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;

if(user && user.email === email && user.password === password){

alert("Login Successful!");

localStorage.setItem("loggedIn", "true");

window.location.href = "index.html";

}else{
alert("Invalid Credentials");
}

}

</script>

</body>
</html>
