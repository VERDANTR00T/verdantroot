<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Skin Intelligence | Verdant Root</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

/* BASE THEME (MATCH INDEX) */
body{
margin:0;
font-family:'Inter',sans-serif;
background: radial-gradient(circle at top,#0a0f0d,#020303);
color:#eaeaea;
}

/* GOLD SYSTEM */
:root{
--gold:#c9a84f;
--soft-gold:#e6c27a;
}

/* WRAPPER (UPGRADED CARD) */
.wrapper{
max-width:850px;
margin:80px auto;
padding:60px;
background:rgba(255,255,255,0.04);
backdrop-filter:blur(25px);
border-radius:24px;
box-shadow:0 30px 100px rgba(0,0,0,0.9);
border:1px solid rgba(255,255,255,0.08);
}

/* HEADINGS */
h1{
font-family:'Playfair Display',serif;
text-align:center;
font-size:42px;
letter-spacing:1px;
}

.subtitle{
text-align:center;
opacity:0.7;
margin-bottom:50px;
}

/* STEP TRANSITION */
.step{
display:none;
animation:fade 0.6s ease;
}
.step.active{
display:block;
}

@keyframes fade{
from{opacity:0;transform:translateY(15px);}
to{opacity:1;transform:translateY(0);}
}

/* INPUTS */
label{
display:block;
margin-top:25px;
font-size:13px;
letter-spacing:1px;
color:var(--soft-gold);
}

input,select,textarea{
width:100%;
padding:14px;
margin-top:8px;
background:rgba(255,255,255,0.05);
border:1px solid rgba(255,255,255,0.15);
border-radius:12px;
color:white;
font-size:14px;
transition:0.3s;
}

input:focus,select:focus,textarea:focus{
outline:none;
border-color:var(--gold);
box-shadow:0 0 10px rgba(201,168,79,0.4);
}

/* BUTTON */
button{
margin-top:35px;
padding:15px 34px;
border:1px solid var(--gold);
background:transparent;
color:white;
letter-spacing:2px;
cursor:pointer;
transition:0.4s;
font-family:'Playfair Display',serif;
border-radius:14px;
}

button:hover{
background:var(--gold);
color:#000;
box-shadow:0 0 30px rgba(201,168,79,0.6);
transform:translateY(-2px);
}

button .arrow{
margin-left:10px;
font-size:18px;
}

/* SCAN AREA */
.progress{
width:100%;
height:220px;
background:rgba(255,255,255,0.04);
border-radius:16px;
margin-top:30px;
position:relative;
overflow:hidden;
box-shadow:inset 0 0 25px rgba(0,0,0,0.7);
}

.scan-line{
position:absolute;
top:0;
left:0;
width:100%;
height:2px;
background:linear-gradient(to right, transparent, var(--gold), transparent);
animation:scanAnim 2s linear infinite;
}

@keyframes scanAnim{
0%{top:0;}
100%{top:100%;}
}

/* RESULT CARD */
.result-card{
margin-top:30px;
padding:40px;
background:rgba(255,255,255,0.05);
border-radius:20px;
line-height:1.8;
box-shadow:0 20px 60px rgba(0,0,0,0.8);
border:1px solid rgba(255,255,255,0.08);
}

/* JITSI */
#jitsiContainer{
width:100%;
height:500px;
margin-top:30px;
border-radius:20px;
overflow:hidden;
}

/* BUTTON GROUP */
.pdf-button{
margin-right:15px;
}

</style>
</head>

<body>

<div class="wrapper">

<h1>AI Skin Intelligence</h1>
<p class="subtitle">Clinical-grade preliminary digital evaluation</p>

<!-- Step 1 -->
<div class="step active" id="step1">
<label>Full Name</label>
<input type="text" id="name">

<label>Age</label>
<input type="number" id="age">

<button onclick="nextStep()">CONTINUE</button>
</div>

<!-- Step 2 -->
<div class="step" id="step2">
<label>Primary Skin Concern</label>
<select id="concern">
<option>Acne</option>
<option>Pigmentation</option>
<option>Dryness</option>
<option>Oiliness</option>
<option>Dark Spots</option>
<option>Sensitivity</option>
</select>

<label>Describe Symptoms</label>
<textarea id="description" rows="4"></textarea>

<label>Lifestyle / Daily Habits</label>
<textarea id="habits" rows="3"></textarea>

<label>Any Allergies / Sensitive Ingredients?</label>
<textarea id="allergies" rows="2"></textarea>

<label>Upload Skin Image (optional)</label>
<input type="file" id="skinImage" accept="image/*">

<button onclick="startAnalysis()">BEGIN AI ANALYSIS</button>
</div>

<!-- Step 3 -->
<div class="step" id="step3">
<p>Analyzing skin biomarkers...</p>

<div class="progress">
<div class="scan-line"></div>
</div>

<div id="resultArea"></div>

<div style="margin-top:20px;">
<button class="pdf-button" id="downloadPdfBtn">Download PDF Report</button>
<button class="pdf-button" id="printBtn">Print Report</button>
</div>

<button id="startConsultBtn" style="display:none;margin-top:20px;">Start Live Consultation</button>
<div id="jitsiContainer"></div>
</div>

</div>

<script src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'></script>
<script src='https://meet.jit.si/external_api.js'></script>

<script>
function nextStep(){
document.getElementById("step1").classList.remove("active");
document.getElementById("step2").classList.add("active");
}

function startAnalysis(){
document.getElementById("step2").classList.remove("active");
document.getElementById("step3").classList.add("active");

setTimeout(function(){

const name=document.getElementById("name").value;
const concern=document.getElementById("concern").value;

const tips=[
`Skin Concern: ${concern}`,
"Tip: Use gentle products",
"Tip: Stay hydrated",
"Tip: Daily sunscreen"
];

let html="<div class='result-card'><h2 style='color:#e6c27a;'>AI Insights</h2><ul>";
tips.forEach(t=>{html+=`<li>${t}</li>`});
html+="</ul></div>";

document.getElementById("resultArea").innerHTML=html;

document.getElementById("startConsultBtn").style.display="inline-block";

},2500);
}
</script>

</body>
</html>
