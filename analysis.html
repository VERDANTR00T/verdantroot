<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Skin Intelligence | Verdant Root</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="wrapper">

<h1>AI Skin Intelligence</h1>
<p class="subtitle">Clinical-grade preliminary digital evaluation</p>

<!-- Step 1 -->
<div class="step active" id="step1">
<label>Full Name</label>
<input type="text" id="name">

<label>Age</label>
<input type="number" id="age">

<button onclick="nextStep()">CONTINUE</button>
</div>

<!-- Step 2 -->
<div class="step" id="step2">
<label>Primary Skin Concern</label>
<select id="concern">
<option>Acne</option>
<option>Pigmentation</option>
<option>Dryness</option>
<option>Oiliness</option>
<option>Dark Spots</option>
<option>Sensitivity</option>
</select>

<label>Describe Symptoms</label>
<textarea id="description" rows="4"></textarea>

<label>Lifestyle / Daily Habits</label>
<textarea id="habits" rows="3" placeholder="Sleep, diet, skincare routine..."></textarea>

<label>Any Allergies / Sensitive Ingredients?</label>
<textarea id="allergies" rows="2"></textarea>

<label>Upload Skin Image (optional)</label>
<input type="file" id="skinImage" accept="image/*">

<button onclick="startAnalysis()">BEGIN AI ANALYSIS</button>
</div>

<!-- Step 3 -->
<div class="step" id="step3">
<p>Analyzing skin biomarkers...</p>

<div class="progress">
    <div class="scan-line"></div>
</div>

<div id="resultArea"></div>

<div style="margin-top:20px;">
<button class="pdf-button" id="downloadPdfBtn">Download PDF Report</button>
<button class="pdf-button" id="printBtn">Print Report</button>
</div>

<button id="startConsultBtn" style="display:none; margin-top:20px;">Start Live Consultation</button>
<div id="jitsiContainer"></div>
</div>

</div>

<script src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'></script>
<script src='https://meet.jit.si/external_api.js'></script>

<script>
function nextStep() {
    document.getElementById("step1").classList.remove("active");
    document.getElementById("step2").classList.add("active");
}

function startAnalysis() {
    document.getElementById("step2").classList.remove("active");
    document.getElementById("step3").classList.add("active");

    setTimeout(function() {
        const name = document.getElementById("name").value;
        const concern = document.getElementById("concern").value;
        const description = document.getElementById("description").value;
        const habits = document.getElementById("habits").value;
        const allergies = document.getElementById("allergies").value;
        const imageFile = document.getElementById("skinImage").files[0] ? document.getElementById("skinImage").files[0] : null;

        const tips = [
            `Skin Concern: ${concern}`,
            `Symptoms: ${description}`,
            `Lifestyle: ${habits}`,
            `Allergies: ${allergies}`,
            "Tip 1: Use gentle, non-comedogenic products",
            "Tip 2: Maintain hydration and sunscreen daily",
            "Tip 3: Follow routine consistently",
            "Tip 4: Consult a specialist if condition persists"
        ];

        let tipsHTML = "<div class='result-card'><h2>Advanced AI + Doctor Verified Tips:</h2><ul>";
        tips.forEach(tip => { tipsHTML += `<li>${tip}</li>`; });
        tipsHTML += `</ul><button onclick="window.location.href='index.html'">Return Home <span class="arrow">➜</span></button></div>`;
        document.getElementById("resultArea").innerHTML = tipsHTML;

        // PDF generation
        document.getElementById("downloadPdfBtn").onclick = async function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFont("times", "normal");
            doc.setFontSize(16);
            doc.text("Verdant Root - AI Skin Report", 20, 20);
            doc.setFontSize(12);
            doc.text(`Name: ${name}`, 20, 35);
            doc.text(`Skin Concern: ${concern}`, 20, 45);
            doc.text(`Symptoms: ${description}`, 20, 55);
            doc.text(`Lifestyle: ${habits}`, 20, 65);
            doc.text(`Allergies: ${allergies}`, 20, 75);
            let yOffset = 85;

            tips.forEach(tip => {
                doc.text(`- ${tip}`, 20, yOffset);
                yOffset += 10;
            });

            if(imageFile){
                const reader = new FileReader();
                reader.onload = function(evt){
                    const imgData = evt.target.result;
                    doc.addImage(imgData, 'JPEG', 20, yOffset, 160, 120);
                    doc.save(`Skin_Report_${name}.pdf`);
                };
                reader.readAsDataURL(imageFile);
            } else {
                doc.save(`Skin_Report_${name}.pdf`);
            }
        };

        // Print
        document.getElementById("printBtn").onclick = function() {
            const printContent = document.getElementById("resultArea").innerHTML;
            const win = window.open('', '', 'width=800,height=600');
            win.document.write('<html><head><title>Print Report</title></head><body style="background:#071a15;color:white;font-family:Inter,sans-serif;">');
            win.document.write(printContent);
            win.document.write('</body></html>');
            win.document.close();
            win.print();
        };

        // Jitsi live consultation
        const consultBtn = document.getElementById("startConsultBtn");
        consultBtn.style.display = "inline-block";
        consultBtn.onclick = function() {
            const domain = "meet.jit.si";
            const options = {
                roomName: "VerdantRoot_Consultation_" + Date.now(),
                parentNode: document.querySelector('#jitsiContainer'),
                width: "100%",
                height: 500
            };
            const api = new JitsiMeetExternalAPI(domain, options);
            consultBtn.style.display = "none";
        };

    }, 2600);
}
</script>

</body>
</html>
