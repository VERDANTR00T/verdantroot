<!DOCTYPE html>                
<html>                
<head>                
<meta charset="UTF-8">                
<meta name="viewport" content="width=device-width, initial-scale=1.0">                
<title>Verdant Root Shop</title>                

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">                

<style>                

body{
margin:0;
font-family:'Inter',sans-serif;
background: radial-gradient(circle at 20% 20%, #121212, #050505 60%, #000000 100%);
color:#f5f5f5;
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background: radial-gradient(circle at 80% 10%, rgba(212,175,55,0.15), transparent 50%);
z-index:-1;
}

/* HEADER */
header{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px 50px;
border-bottom:1px solid rgba(212,175,55,0.2);
}

.logo{
font-family:'Playfair Display',serif;
font-size:30px;
color:#d4af37;
}

nav{
display:flex;
align-items:center;
}

nav a{
margin-left:30px;
text-decoration:none;
color:#ccc;
transition:0.3s;
}

nav a:hover{
color:#d4af37;
}

/* HAMBURGER */
.menu-toggle{
display:none;
font-size:26px;
cursor:pointer;
}

/* CART */
.cart{
background:linear-gradient(135deg,#d4af37,#f0d57a);
color:#000;
padding:8px 16px;
border-radius:25px;
margin-left:20px;
}

/* PRODUCTS */
.container{
max-width:1300px;
margin:auto;
padding:50px 30px;
}

.title{
font-family:'Playfair Display',serif;
font-size:42px;
text-align:center;
color:#d4af37;
}

.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:35px;
}

/* CARD */
.card{
background:rgba(255,255,255,0.03);
border-radius:18px;
padding:22px;
text-align:center;
transition:0.4s;
position:relative;
overflow:hidden;
cursor:pointer;
}

.card:hover{
transform:translateY(-10px) scale(1.02);
box-shadow:0 20px 60px rgba(0,0,0,0.9);
}

/* IMAGE */
.card img{
width:100%;
border-radius:12px;
}

.product-name{margin-top:15px;}
.price{color:#d4af37;}

/* BUTTON */
button{
margin-top:10px;
padding:10px 18px;
border:none;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.add{
background:linear-gradient(135deg,#d4af37,#e6c25a);
color:#000;
}

.buy{
border:1px solid #d4af37;
background:transparent;
color:#d4af37;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

.popup-content{
background:#111;
padding:30px;
border-radius:15px;
max-width:400px;
text-align:center;
animation:fadeIn 0.4s;
}

@keyframes fadeIn{
from{opacity:0; transform:scale(0.9);}
to{opacity:1; transform:scale(1);}
}

/* MOBILE */
@media(max-width:768px){

.menu-toggle{
display:block;
}

nav{
display:none;
flex-direction:column;
width:100%;
}

nav.active{
display:flex;
}

}

</style>                
</head>                

<body>                

<header>                
<div class="logo">Verdant Root</div>                

<div class="menu-toggle" onclick="toggleMenu()">☰</div>

<nav id="navMenu">                
<a href="index.html">Home</a>                
<a href="analysis.html">AI Scan</a>                
<span class="cart">🛒 <span id="count">0</span></span>                
</nav>                
</header>                

<div class="container">                
<div class="title">Premium Store</div>                

<div class="products">                

<div class="card" onclick="openPopup('Vitamin C Serum','₹799')">                
<img src="https://png.pngtree.com/png-vector/20250522/ourlarge/pngtree-vitamin-c-serum-bottle-illustration-png-image_16075359.png">
<div class="product-name">Vitamin C Serum</div>
<div style="text-decoration:line-through; opacity:0.5;">₹1299</div>
<div class="price">₹799</div>
<button class="add" onclick="event.stopPropagation(); add()">Add</button>
<button class="buy" onclick="event.stopPropagation(); buy()">Buy</button>
</div>

<div class="card" onclick="openPopup('Cleanser','₹599')">                
<img src="https://p7.hiclipart.com/preview/750/528/1020/5bbd5985695c0.jpg">
<div class="product-name">Hydrating Cleanser</div>
<div class="price">₹599</div>
<button class="add" onclick="event.stopPropagation(); add()">Add</button>
<button class="buy" onclick="event.stopPropagation(); buy()">Buy</button>
</div>

</div>                
</div>                

<!-- POPUP -->
<div class="popup" id="popup">
<div class="popup-content">
<h2 id="pname"></h2>
<p id="pprice"></p>
<button onclick="closePopup()">Close</button>
</div>
</div>

<script>                

let cart=0;

function add(){
cart++;
document.getElementById("count").innerText=cart;

let msg = document.createElement("div");
msg.innerText = "🔥 Only few items left!";
msg.style.position="fixed";
msg.style.bottom="20px";
msg.style.right="20px";
msg.style.background="#d4af37";
msg.style.color="#000";
msg.style.padding="10px 20px";
msg.style.borderRadius="8px";

document.body.appendChild(msg);

setTimeout(()=>{ msg.remove(); }, 2500);
}

function buy(){
alert("Checkout coming soon");
}

/* MENU */
function toggleMenu(){
document.getElementById("navMenu").classList.toggle("active");
}

/* POPUP */
function openPopup(name,price){
document.getElementById("popup").style.display="flex";
document.getElementById("pname").innerText=name;
document.getElementById("pprice").innerText=price;
}

function closePopup(){
document.getElementById("popup").style.display="none";
}
  
window.onload = function(){

let routine = JSON.parse(localStorage.getItem("routine"));

if(!routine) return;

let products = document.querySelectorAll(".card");

products.forEach(card => {

let name = card.querySelector(".product-name").innerText;

if(
routine.morning.includes(name) ||
routine.night.includes(name)
){
card.style.border = "1px solid gold";
card.style.boxShadow = "0 0 20px rgba(212,175,55,0.6)";
}
});

};
</script>                

</body>                
</html>
